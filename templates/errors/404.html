{% extends "base.html" %}
{% block title %}404 Not Found — PulseCare HMS{% endblock %}
{% block breadcrumb %}Page Not Found{% endblock %}
{% block content %}
<div class="card" style="max-width:540px;margin:40px auto;text-align:center;padding:var(--space-8);">
  <div style="font-size:3.5rem;font-weight:800;color:var(--text-muted);margin-bottom:12px;">404</div>
  <h2 style="font-size:var(--font-size-xl);font-weight:700;color:var(--text-primary);margin-bottom:8px;">Page Not Found</h2>
  <p style="color:var(--text-secondary);font-size:var(--font-size-sm);margin-bottom:24px;">The clinical resource or page you requested could not be located in the system.</p>
  <a href="{{ url_for('index') }}" class="btn btn-primary">Return to Homepage</a>
</div>
{% endblock %}
